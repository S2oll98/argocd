apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devops-argocd

# 최소 구성 — helm 차트만. 접속은 port-forward + 로컬 admin
# ingress·OIDC 는 LBC·ESO·authentik 이 올라온 뒤 추가 (RUNBOOK §3)
helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "10.2.2"
    releaseName: argocd
    namespace: devops-argocd
    valuesFile: values.yaml
