apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-projects
  namespace: devops-argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"   # AppProject 선행 (appsets 가 참조)
spec:
  project: bootstrap
  source:
    repoURL: https://github.com/S2oll98/argocd.git
    targetRevision: main
    path: projects   # projects/*.yaml = AppProject. recurse 는 기본이 false — 명시하면 API 가 지워 OutOfSync 가 됨
  destination:
    server: https://kubernetes.default.svc   # 허브 로컬 (AppProject 는 ArgoCD ns 리소스)
    namespace: devops-argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
